name: Build and Deploy to Azure

on:
  push:
    branches: ["main", "master", "develop"]
  workflow_dispatch:

env:
  SERVICE_NAME: sales-service
  DOCKERFILE_PATH: Dockerfile

  SOLUTION_PATH: SalesService.sln
  UNIT_TEST_PROJECT_PATH: SalesService.UnitTests/SalesService.UnitTests.csproj
  INTEGRATION_TEST_PROJECT_PATH: SalesService.IntegrationTests/SalesService.IntegrationTests.csproj

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Create NuGet Config
        run: |
          echo '<?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />
              <add key="github" value="https://nuget.pkg.github.com/anton-yakubau-innowise/index.json" />
            </packageSources>
            <packageSourceCredentials>
              <github>
                <add key="Username" value="anton-yakubau-innowise" />
                <add key="ClearTextPassword" value="${{ secrets.GH_PACKAGES_TOKEN }}" />
              </github>
            </packageSourceCredentials>
          </configuration>' > ./NuGet.Config

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }} --configfile ./NuGet.Config

      - name: Run Unit Tests
        run: dotnet test ${{ env.UNIT_TEST_PROJECT_PATH }} --no-restore --verbosity normal

      - name: Run Integration Tests
        run: dotnet test ${{ env.INTEGRATION_TEST_PROJECT_PATH }} --no-restore --verbosity normal

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.REGISTRY_LOGIN_SERVER }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ env.DOCKERFILE_PATH }}
          push: true
          tags: |
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.SERVICE_NAME }}:latest
          secret-files: |
            nugetconfig=./NuGet.Config

      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          acrName: automotivegroupcontainers
          containerAppName: ${{ env.SERVICE_NAME }}
          resourceGroup: AutomotiveGroup-Apps
          imageToDeploy: ${{ secrets.REGISTRY_LOGIN_SERVER }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
